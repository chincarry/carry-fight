# /etc/turnserver.conf —— coturn 中继配置模板
# 用途：当两名玩家的网络属于「对称型 NAT」无法直连时，由这台服务器转发游戏数据
# 部署步骤见 ../部署指南.md 第五节

# ---- 网络 ----
listening-port=3478
# 若要同时支持 TLS（需要域名+证书），取消下面两行注释
# tls-listening-port=5349
# cert=/etc/letsencrypt/live/你的域名/fullchain.pem
# pkey=/etc/letsencrypt/live/你的域名/privkey.pem

# 对外公布的中继地址（写服务器公网 IP，多个 IP 用逗号分隔）
external-ip=YOUR_SERVER_IP

# 中继端口范围（云服务器安全组要放行同一段 UDP）
min-port=49152
max-port=65535

# ---- 认证 ----
# 长期凭证方式：用户名/密码，简单可靠，适合小规模使用
lt-cred-mech
user=bvn:YOUR_SECRET
realm=bvn.gicp.fun

# ---- 其他 ----
fingerprint
no-cli
no-tlsv1
no-tlsv1_1
# 关闭多余的中继出口限制，保持默认即可
# 日志（排查问题时看 /var/log/turnserver.log）
log-file=/var/log/turnserver.log
simple-log
