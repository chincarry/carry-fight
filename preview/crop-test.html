<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>立绘裁切标定 v2</title>
<style>html,body{margin:0;background:#20232a;font-family:"PingFang SC",sans-serif}canvas{display:block}</style>
</head>
<body>
<canvas id="cv"></canvas>
<script src="/Users/liheyang/WorkBuddy/2026-11-04-17-30-02/js/data.js"></script>
<script src="/Users/liheyang/WorkBuddy/2026-11-04-17-30-02/js/art.js"></script>
<script src="/Users/liheyang/WorkBuddy/2026-11-04-17-30-02/js/art-bg.js"></script>
<script>
(function () {
  'use strict';
  var BVN = window.BVN, Art = BVN.Art, ROOT = '/Users/liheyang/WorkBuddy/2026-11-04-17-30-02/';
  var COLS = 2, BW = 460, BH = 256, CELLW = 476, CELLH = 306, PAD = 6, TOP = 44;
  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var CW = COLS * CELLW + PAD;
  var CH = TOP + 4 * CELLH + PAD;
  cv.width = CW; cv.height = CH; cv.style.width = CW + 'px'; cv.style.height = CH + 'px';

  // 待标定：(fx, fy, zoom)
  var CFG = {
    hannya: [0.30, 0.41, 1.3],
    angel: [0.57, 0.18, 2.2],
    boxer: [0.50, 0.32, 1.0],
    dancer: [0.52, 0.17, 3.0],
    dragon: [0.50, 0.17, 2.6],
    warlock: [0.55, 0.19, 2.4],
    ranger: [0.38, 0.41, 1.8],
    ronin: [0.46, 0.25, 2.0],
  };

  var imgs = {}, n = 0;

  function win(c, im, z) {
    var ax = c[0], ay = c[1];
    var rr = BW / BH;
    var ir = im.width / im.height;
    var sw = im.width, sh = im.height;
    if (ir > rr) sw = im.height * rr; else sh = im.width / rr;
    sw /= z; sh /= z;
    var maxSx = Math.max(0, im.width - sw), maxSy = Math.max(0, im.height - sh);
    var sx = Math.min(maxSx, Math.max(0, im.width * ax - sw * 0.5));
    var sy = Math.min(maxSy, Math.max(0, im.height * ay - sh * 0.5));
    return { sx: sx, sy: sy, sw: sw, sh: sh,
      nx: sx / im.width, ny: sy / im.height,
      nw: sw / im.width, nh: sh / im.height };
  }

  function draw() {
    ctx.fillStyle = '#20232a'; ctx.fillRect(0, 0, CW, CH);
    ctx.fillStyle = '#e8ecf6'; ctx.font = '13px sans-serif'; ctx.textBaseline = 'alphabetic';
    ctx.fillText('裁切结果（十字=锚点，锚点应落在鼻子上）｜右侧数字=源图归一化窗口', 10, 18);
    for (var i = 0; i < BVN.ROSTER.length; i++) {
      var c = BVN.ROSTER[i], im = imgs[c.id];
      var cfg = CFG[c.id] || [0.5, 0.34, 1];
      var col = i % COLS, row = (i / COLS) | 0;
      var x = PAD + col * CELLW, y = TOP + row * CELLH;
      if (im && im.width) {
        ctx.save();
        ctx.beginPath(); ctx.rect(x, y, BW, BH); ctx.clip();
        Art.drawCover(ctx, im, x, y, BW, BH, cfg[0], cfg[1], cfg[2]);
        ctx.restore();
        ctx.strokeStyle = 'rgba(120,140,180,0.6)'; ctx.strokeRect(x, y, BW, BH);
        // 十字准心 = 锚点（考虑 clamp 后锚点在窗口内的实际位置）
        var w = win(cfg, im, cfg[2]);
        var ax = (im.width * cfg[0] - w.sx) / w.sw;
        var ay = (im.height * cfg[1] - w.sy) / w.sh;
        ctx.strokeStyle = 'rgba(255,90,90,0.95)'; ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(x + BW * ax - 10, y + BH * ay); ctx.lineTo(x + BW * ax + 10, y + BH * ay);
        ctx.moveTo(x + BW * ax, y + BH * ay - 10); ctx.lineTo(x + BW * ax, y + BH * ay + 10);
        ctx.stroke();
        ctx.fillStyle = '#8fe8b0'; ctx.font = '10px monospace';
        ctx.fillText('z' + cfg[2].toFixed(1) + ' nx' + w.nx.toFixed(3) + ' ny' + w.ny.toFixed(3) +
          ' nw' + w.nw.toFixed(3) + ' nh' + w.nh.toFixed(3), x + 2, y + BH + 11);
        ctx.fillStyle = '#e8ecf6'; ctx.font = '12px sans-serif';
        ctx.fillText(c.id, x + 2, y + BH + 24);
      }
    }
  }

  BVN.ROSTER.forEach(function (c) {
    var im = new Image();
    im.onload = im.onerror = function () { if (++n === BVN.ROSTER.length) draw(); };
    im.src = ROOT + 'assets/chars/' + c.id + '.jpg';
    imgs[c.id] = im;
  });
})();
</script>
</body>
</html>
